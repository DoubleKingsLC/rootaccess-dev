    <path d="M10.9 11.9C9.2 11.9 8 10.8 8 8.9C8 7 9.1 5.9 10.7 5.9C12.4 5.9 13.4 7.1 13.4 8.9C13.4 9.1 13.4 9.3 13.4 9.4H9.3C9.4 10.4 10.1 11 11 11C11.7 11 12.2 10.7 12.5 10.2L13.3 10.8C12.8 11.5 11.9 11.9 10.9 11.9ZM9.3 8.3H12.1C12 7.5 11.5 7.1 10.8 7.1C10.1 7.1 9.6 7.5 9.3 8.3Z" />
  </g>
</svg>

