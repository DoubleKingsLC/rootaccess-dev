<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Transparent background, circular badge -->
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#020617" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Circle badge -->
  <g filter="url(#shadow)">
    <circle cx="32" cy="32" r="26" fill="#e5e7eb" />
  </g>

  <!-- Key / network line motif -->
  <g transform="translate(15,30)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Line -->
    <path d="M2 2 H16" stroke="#0f766e" stroke-width="2.5" />
    <!-- Node -->
    <circle cx="2" cy="2" r="2.5" fill="#020617" stroke="#0f766e" stroke-width="1.2" />
  </g>

  <!-- 'ra' letters -->
